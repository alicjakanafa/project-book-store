<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/books_styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alan+Sans:wght@300..900&display=swap" rel="stylesheet">
  <title>Our Books</title>
</head>

<body>

  <header>
    <h1>Kofi's Bookstore</h1>

  <nav>
    <a href="/">Home</a>
    <a href="/books">Books</a>
    <a href="/books/new">Add Book</a>
    <a href="/users/new">Sign Up</a>
  </nav>
  </header>

  <main>

  <form class="search-form" method="GET" action="/books">
    <h2>Find a Book</h2>

    <div class="search-fields">
      <div>
        <label for="search-title">Search by title</label>
        <input
          type="text"
          id="search-title"
          name="title"
          placeholder="Search by title"
          value="{{ search_title }}"
        >
      </div>

      <div>
        <label for="search-author">Search by author</label>
        <input
          type="text"
          id="search-author"
          name="author"
          placeholder="Search by author"
          value="{{ search_author }}"
        >
      </div>

      <div>
        <label for="search-year">Search by year</label>
        <input
          type="number"
          id="search-year"
          name="year"
          placeholder="Year"
          value="{{ search_year }}"
        >
      </div>
    </div>

    <button type="submit">Search</button>

    <a href="/books" class="clear-search">
      Clear
    </a>
  </form>

    <h1>Our Books</h1>

    <section class="book-list">

      {% if books %}
        {% for book in books %}
          <article class="book-card">

            <img
              class="book-cover"
              src="{{ url_for(
                'static',
                filename='images/' ~ book.title ~ '.jpg'
              ) }}"
              alt="Cover of {{ book.title }}"
            >

            <h2 class="book-title">{{ book.title }}</h2>
            <p class="book-author">By {{ book.author }}</p>
            <p class="book-year">Published: {{ book.year }}</p>

          </article>
        {% endfor %}

      {% else %}
        <p>No books matched your search.</p>
      {% endif %}

    </section>
    </main>

</body>
</html>
